<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>MOSS</title>
    <script type="text/javascript">
      // 1. Сохраняем путь (например, /kashaeva/about), куда хотел попасть пользователь
      var path = window.location.pathname;
      if (path.startsWith('/kashaeva/')) {
        path = path.slice('/kashaeva/'.length);
      }
      sessionStorage.setItem('redirect_path', '/' + path + window.location.search);
      
      // 2. Отправляем его на главную (на наш index.html), чтобы загрузился React
      window.location.replace('/kashaeva/');
    </script>
  </head>
  <body></body>
</html>
